[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ztip"
version = "1.0.0.dev2"
description = "ZTIP reference runtime — RFC 8785 canonicalization, SHA-256 hashing, and integrity verification for the Zero Trust Intelligence Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chad McCormack" }]
keywords = ["ztip", "zero-trust", "ai-agents", "integrity", "audit", "protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/bitscon/ztip"
Repository = "https://github.com/bitscon/ztip"

[project.scripts]
ztip = "ztip.cli:main"

[tool.setuptools.packages.find]
include = ["ztip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
